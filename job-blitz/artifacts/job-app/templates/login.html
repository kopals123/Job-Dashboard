<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobBlitz — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="flex items-center justify-center gap-2 mb-8">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center text-base font-bold shadow-lg shadow-violet-900/40">J</div>
      <span class="font-bold text-xl text-white">JobBlitz</span>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="mb-4 px-4 py-3 rounded-xl text-sm
          {% if category == 'error' %}bg-red-900/40 border border-red-700/50 text-red-300
          {% else %}bg-green-900/40 border border-green-700/50 text-green-300{% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Card -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">

      <!-- Tabs -->
      <div class="flex bg-gray-800 rounded-xl p-1 mb-6" id="auth-tabs">
        <button onclick="switchTab('login')" id="tab-login"
          class="flex-1 py-2 text-sm font-medium rounded-lg transition-colors bg-gray-700 text-white">
          Sign In
        </button>
        <button onclick="switchTab('register')" id="tab-register"
          class="flex-1 py-2 text-sm font-medium rounded-lg transition-colors text-gray-400 hover:text-gray-200">
          Create Account
        </button>
      </div>

      <!-- Login form -->
      <form id="form-login" method="POST" action="/login" class="space-y-4">
        <div>
          <label class="text-xs text-gray-500 block mb-1.5">Email address</label>
          <input type="email" name="email" required autocomplete="email"
            placeholder="you@example.com"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-violet-500 transition-colors">
        </div>
        <div>
          <label class="text-xs text-gray-500 block mb-1.5">Password</label>
          <input type="password" name="password" required autocomplete="current-password"
            placeholder="••••••••"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-violet-500 transition-colors">
        </div>
        <button type="submit"
          class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-lg shadow-violet-900/30 mt-2">
          Sign In
        </button>
        <div class="text-center mt-3">
          <a href="/forgot-password" class="text-xs text-gray-500 hover:text-violet-400 transition-colors">Forgot your password?</a>
        </div>
      </form>

      <!-- Register form -->
      <form id="form-register" method="POST" action="/register" class="space-y-4 hidden">
        <div>
          <label class="text-xs text-gray-500 block mb-1.5">Your name</label>
          <input type="text" name="name" autocomplete="name"
            placeholder="Jane Smith"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-violet-500 transition-colors">
        </div>
        <div>
          <label class="text-xs text-gray-500 block mb-1.5">Email address</label>
          <input type="email" name="email" required autocomplete="email"
            placeholder="you@example.com"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-violet-500 transition-colors">
        </div>
        <div>
          <label class="text-xs text-gray-500 block mb-1.5">Password <span class="text-gray-600">(min 6 chars)</span></label>
          <input type="password" name="password" required autocomplete="new-password"
            placeholder="••••••••" minlength="6"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-violet-500 transition-colors">
        </div>
        <button type="submit"
          class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-lg shadow-violet-900/30 mt-2">
          Create Account
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-600 mt-6">
      Your data is private — each account has its own dashboard and applications.
    </p>
  </div>

  <script>
    if (window.location.search.includes('tab=register')) {
      switchTab('register');
    }

    function switchTab(tab) {
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLogin.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-colors bg-gray-700 text-white';
        tabRegister.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-colors text-gray-400 hover:text-gray-200';
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabRegister.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-colors bg-gray-700 text-white';
        tabLogin.className = 'flex-1 py-2 text-sm font-medium rounded-lg transition-colors text-gray-400 hover:text-gray-200';
      }
    }
  </script>
</body>
</html>
